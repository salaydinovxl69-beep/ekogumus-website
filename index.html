<!doctype html>
<html lang="ru">
  <head>
    <link rel="icon" type="image/png" href="../images/originals/logo.webp">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Ekogumus — Органические удобрения на основе биогумуса</title>
    <meta
      name="description"
      content="Ekogumus — органические удобрения на основе биогумуса для садоводов и агробизнеса: повышают урожайность, улучшают структуру почвы и экологичность производства."
    />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ekogumus.com/" />
    <meta property="og:title" content="Ekogumus — Органические удобрения на основе биогумуса" />
    <meta
      property="og:description"
      content="Повышайте урожайность и восстанавливайте плодородие почвы с экологически чистыми удобрениями Ekogumus. 30+ лет опыта, 10 000+ тонн экспорта."
    />
    <meta property="og:image" content="https://ekogumus.com/images/originals/Products.webp" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="uz_UZ" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ekogumus — Органические удобрения" />
    <meta
      name="twitter:description"
      content="Биогумусные удобрения от EkoGumus. Экологично. Эффективно. 30+ лет опыта."
    />
    <meta name="twitter:image" content="https://ekogumus.com/images/originals/Products.webp" />

    <!-- Canonical -->
    <link rel="canonical" href="https://ekogumus.com/" />

    <!-- hreflang -->
    <link rel="alternate" hreflang="ru" href="https://ekogumus.com/" />
    <link rel="alternate" hreflang="uz" href="https://ekogumus.com/?lang=uz" />
    <link rel="alternate" hreflang="en" href="https://ekogumus.com/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://ekogumus.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/originals/logo.webp" />

    <!-- Preconnect to Google Fonts (одиночный preconnect, без блокирующего stylesheet) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load: preload as style, swap to stylesheet on load -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap"
      crossorigin
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap"
        crossorigin
      />
    </noscript>

    <!-- Hero image preload removed - actual hero uses originals/doroga_trava_pole with eager loading -->
    <!-- Using lazy content images approach instead -->

    <!-- JSON-LD: Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EkoGumus",
        "url": "https://ekogumus.com",
        "logo": "https://ekogumus.com/images/originals/logo.webp",
        "description": "Производитель органических удобрений на основе биогумуса калифорнийских червей.",
        "foundingDate": "1997",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "UZ",
          "addressRegion": "Фергана"
        },
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "telephone": "+998-93-641-85-45",
            "contactType": "sales",
            "areaServed": "UZ",
            "availableLanguage": ["Russian", "Uzbek", "English"]
          }
        ],
        "sameAs": [
          "https://www.youtube.com/@biogumusfargonaekogumus8419"
        ]
      }
    </script>

    <!-- JSON-LD: Product structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Органическое удобрение EkoGumus (сухое)",
        "description": "Органические удобрения на основе биогумуса для повышения урожайности и улучшения структуры почвы.",
        "brand": {
          "@type": "Brand",
          "name": "EkoGumus"
        },
        "offers": {
          "@type": "Offer",
          "priceCurrency": "UZS",
          "availability": "https://schema.org/InStock",
          "url": "https://ekogumus.com/products"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
